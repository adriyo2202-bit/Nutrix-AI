<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrix AI - Welcome Back</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js and GSAP for 3D Aesthetics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Required for Web Audio API Autoplay Policy -->
    <div id="start-overlay">
        <button id="start-btn">ENTER</button>
    </div>

    <!-- Cinematic Splash Screen -->
    <div id="splash-screen">
        <h1 class="splash-text">HEALTHY FOOD AI</h1>
    </div>

    <!-- Three.js Canvas Container -->
    <div id="webgl-container"></div>

    <!-- UI Overlay -->
    <div class="screen-flash" id="screenFlash"></div>

    <main class="room off" id="room">
        <!-- Left Side: Lamp -->
        <div class="lamp-container">
            <!-- Light beam -->
            <div class="light-beam" id="roomLight"></div>
            
            <!-- Lamp structure -->
            <div class="lamp" id="lamp3D">
                <div class="lamp-shade">
                    <div class="bulb" id="lampBulb"></div>
                    <div class="shade-rim"></div>
                </div>
                <div class="lamp-stand">
                    <div class="stand-detail top"></div>
                    <div class="stand-detail bottom"></div>
                </div>
                <div class="lamp-base">
                    <div class="base-rim"></div>
                </div>
                
                <!-- Pull chain -->
                <div class="pull-chain" id="pullChain">
                    <div class="chain-line"></div>
                    <div class="chain-knob"></div>
                </div>
            </div>
            
            <!-- Floor glow reflection -->
            <div class="floor-glow" id="floorGlow"></div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="login-wrapper">
            <div class="login-card tilt-effect" id="loginCard">
                <div class="glow-border"></div>
                <h2>Welcome Back</h2>
                <p>Enter your details to access your account</p>

                <form id="loginForm">
                    <div class="input-group signup-only" style="display: none; opacity: 0; height: 0; overflow: hidden;">
                        <i class="fa-regular fa-id-badge"></i>
                        <input type="text" id="fullname" placeholder="Full Name">
                    </div>
                    <div class="input-group">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" placeholder="Email Address" value="dev@cca.com" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Password" value="CCA_WELCOMES" required>
                    </div>

                    <button type="submit" class="btn-signin" id="signInBtn">
                        <span class="btn-text">Sign In</span>
                        <div class="btn-glow"></div>
                    </button>
                </form>

                <div class="divider">
                    <span>OR CONTINUE WITH</span>
                </div>

                <div class="social-login">
                    <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
                    <button class="social-btn"><i class="fa-brands fa-github"></i> GitHub</button>
                </div>

                <div class="auth-switch">
                    <p id="switchText">Don't have an account? <a href="#" id="toggleAuthMode">Sign Up</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
